<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-labelledby="t d">
<title id="t">One hit object, converted</title>
<desc id="d">The osu!mania hit object 64,192,1250 becomes column 1 at positionX -450 and RPE time [4, 1, 8] at 150 BPM with a 400 ms lead-in.</desc>
<defs>
  <linearGradient id="lane1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#FF5FA2"/><stop offset="1" stop-color="#FF5FA2" stop-opacity="0.15"/></linearGradient>
  <linearGradient id="big" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#6FE3FF"/></linearGradient>
  <filter id="glow" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
  text { font-family: "Segoe UI", "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #F4F2FF; }
  .mono { font-family: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
  .dim { fill: rgba(244,242,255,0.55); }
  .label { font-size: 12px; letter-spacing: 2px; }
  .hlx { animation: hlx 9s linear -5.5s infinite; }
  .hlt { animation: hlt 9s linear -5.5s infinite; }
  .k1 { opacity: 0; animation: k1 9s ease-out -5.5s infinite; }
  .k2 { opacity: 0; animation: k2 9s ease-out -5.5s infinite; }
  .k3 { opacity: 0; animation: k3 9s ease-out -5.5s infinite; }
  .k4 { opacity: 0; animation: k4 9s ease-out -5.5s infinite; }
  .k5 { opacity: 0; animation: k5 9s ease-out -5.5s infinite; }
  @keyframes hlx { 0%, 6% { fill: #F4F2FF; } 8%, 30% { fill: #FF5FA2; } 34%, 100% { fill: #FF5FA2; } }
  @keyframes hlt { 0%, 28% { fill: #F4F2FF; } 30%, 100% { fill: #6FE3FF; } }
  @keyframes k1 { 0%, 10% { opacity: 0; transform: translateY(10px); } 14%, 90% { opacity: 1; transform: translateY(0); } 96%, 100% { opacity: 0; transform: translateY(0); } }
  @keyframes k2 { 0%, 20% { opacity: 0; transform: translateY(10px); } 24%, 90% { opacity: 1; transform: translateY(0); } 96%, 100% { opacity: 0; transform: translateY(0); } }
  @keyframes k3 { 0%, 32% { opacity: 0; transform: translateY(10px); } 36%, 90% { opacity: 1; transform: translateY(0); } 96%, 100% { opacity: 0; transform: translateY(0); } }
  @keyframes k4 { 0%, 44% { opacity: 0; transform: translateY(10px); } 48%, 90% { opacity: 1; transform: translateY(0); } 96%, 100% { opacity: 0; transform: translateY(0); } }
  @keyframes k5 { 0%, 56% { opacity: 0; transform: translateY(10px); } 60%, 90% { opacity: 1; transform: translateY(0); } 96%, 100% { opacity: 0; transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; } }
</style>

<rect width="1000" height="360" rx="20" fill="#0E0D18" stroke="rgba(255,255,255,0.08)"/>
<text x="40" y="44" class="mono label dim">OSU!MANIA HIT OBJECT</text>
<text x="40" y="92" class="mono" font-size="32"><tspan class="hlx">64</tspan>,192,<tspan class="hlt">1250</tspan>,1,0,0:0:0:0:</text>
<text x="960" y="44" class="mono label dim" text-anchor="end">4K · 首条红线 0 ms · 150 BPM</text>
<line x1="40" y1="122" x2="960" y2="122" stroke="rgba(255,255,255,0.08)"/>

<!-- column -->
<g class="k1">
  <text x="40" y="162" class="mono label" fill="#FF5FA2" style="fill:#FF5FA2">X → 列 → POSITIONX</text>
  <text x="40" y="186" class="mono" font-size="17">⌊64 × 4 ÷ 512⌋ = 0 → 第 1 列</text>
</g>
<g class="k2">
  <rect x="70" y="196" width="28" height="64" rx="5" fill="url(#lane1)" stroke="rgba(255,255,255,0.22)"/><rect x="104" y="196" width="28" height="64" rx="5" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.22)"/><rect x="138" y="196" width="28" height="64" rx="5" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.22)"/><rect x="172" y="196" width="28" height="64" rx="5" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.22)"/>
  <text x="220" y="226" class="mono" font-size="17">((0 + 0.5) ÷ 4 − 0.5) × 1200</text>
  <text x="220" y="256" class="mono" font-size="22">= <tspan style="fill:#FF5FA2">−450</tspan></text>
</g>

<!-- time -->
<g class="k3">
  <text x="560" y="162" class="mono label" style="fill:#6FE3FF">毫秒 → 拍</text>
  <text x="560" y="186" class="mono" font-size="17">(1250 − 0) ÷ 400 ms/拍 = 3.125 拍</text>
</g>
<g class="k4">
  <text x="560" y="214" class="mono" font-size="17">+ 400 ms 前奏 = 1 拍  →  4.125 拍</text>
</g>
<g class="k5">
  <text x="560" y="290" class="mono" font-size="64" font-weight="700" style="fill:url(#big)" filter="url(#glow)">[4, 1, 8]</text>
  <text x="560" y="326" font-size="14" class="dim">RPE startTime = [整拍, 分子, 分母] = 4 + 1/8</text>
</g>
</svg>
