<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="t d">
<title id="t">osz2pez</title>
<desc id="d">Notes fall down four osu!mania lanes on the left and, in sync, onto a single tilting Phira judge line on the right.</desc>
<defs>
  <radialGradient id="gP" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FF5FA2" stop-opacity="0.42"/><stop offset="1" stop-color="#FF5FA2" stop-opacity="0"/></radialGradient>
  <radialGradient id="gC" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#6FE3FF" stop-opacity="0.36"/><stop offset="1" stop-color="#6FE3FF" stop-opacity="0"/></radialGradient>
  <radialGradient id="gV" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#8F7CFF" stop-opacity="0.30"/><stop offset="1" stop-color="#8F7CFF" stop-opacity="0"/></radialGradient>
  <linearGradient id="noteL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FF5FA2"/></linearGradient>
  <linearGradient id="noteR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#6FE3FF"/></linearGradient>
  <linearGradient id="laneFlash" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#FF5FA2" stop-opacity="0.75"/><stop offset="1" stop-color="#FF5FA2" stop-opacity="0"/></linearGradient>
  <linearGradient id="laneBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF5FA2" stop-opacity="0"/><stop offset="1" stop-color="#FF5FA2" stop-opacity="0.10"/></linearGradient>
  <linearGradient id="judge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="0.12" stop-color="#FFFFFF"/><stop offset="0.88" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
  <linearGradient id="osz" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFC2DC"/><stop offset="1" stop-color="#FF5FA2"/></linearGradient>
  <linearGradient id="pez" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E6FBFF"/><stop offset="1" stop-color="#6FE3FF"/></linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="field"><rect x="110" y="34" width="224" height="300"/></clipPath>
  <clipPath id="sky"><rect x="840" y="34" width="300" height="270"/></clipPath>
  <linearGradient id="fadeTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000"/><stop offset="0.25" stop-color="#fff"/></linearGradient>
  <mask id="topFade" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="380"><rect width="1200" height="380" fill="url(#fadeTop)"/></mask>
</defs>
<style>
  text { font-family: "Segoe UI", "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .mono { font-family: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
  .nl { animation: fallL 3.2s linear infinite; }
  .nr { animation: fallR 3.2s linear infinite; }
  .fl { opacity: 0; animation: flash 3.2s linear infinite; }
  .bu { opacity: 0; transform-box: fill-box; transform-origin: center; animation: burst 3.2s linear infinite; }
  .tilt { transform-origin: 990px 290px; animation: tilt 6.4s ease-in-out infinite; }
  .flow { stroke-dasharray: 6 10; animation: flow 0.8s linear infinite; }
  .st rect { fill: rgba(255,255,255,0.04); stroke: rgba(255,255,255,0.18); }
  .st text { font-size: 11px; fill: #F4F2FF; text-anchor: middle; font-family: ui-monospace, Consolas, monospace; }
  .st { opacity: 0.4; animation: stage 3.2s linear infinite; }
  .st rect { animation: stageBox 3.2s linear infinite; animation-delay: inherit; }
  .sep { stroke: rgba(255,255,255,0.18); stroke-width: 1.5; }
  .two { animation: pulse 0.4s ease-out infinite; }
  @keyframes fallL { 0% { transform: translateY(0); opacity: 0; } 6% { opacity: 1; } 50% { transform: translateY(298px); opacity: 1; } 50.5%, 100% { transform: translateY(298px); opacity: 0; } }
  @keyframes fallR { 0% { transform: translateY(0); opacity: 0; } 8% { opacity: 1; } 50% { transform: translateY(230px); opacity: 1; } 50.5%, 100% { transform: translateY(230px); opacity: 0; } }
  @keyframes flash { 0%, 49.9% { opacity: 0; } 50% { opacity: 0.85; } 60%, 100% { opacity: 0; } }
  @keyframes burst { 0%, 49.9% { opacity: 0; transform: rotate(45deg) scale(0.3); } 50% { opacity: 1; transform: rotate(45deg) scale(0.5); } 64%, 100% { opacity: 0; transform: rotate(90deg) scale(2.6); } }
  @keyframes tilt { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
  @keyframes flow { to { stroke-dashoffset: -16; } }
  @keyframes stage { 0%, 19.9% { opacity: 1; } 20%, 100% { opacity: 0.4; } }
  @keyframes stageBox { 0%, 19.9% { fill: rgba(143,124,255,0.35); stroke: #8F7CFF; } 20%, 100% { fill: rgba(255,255,255,0.04); stroke: rgba(255,255,255,0.18); } }
  @keyframes pulse { 0% { fill-opacity: 1; } 60%, 100% { fill-opacity: 0.55; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>

<rect width="1200" height="380" rx="24" fill="#0B0A14"/>
<circle cx="220" cy="200" r="300" fill="url(#gP)"/>
<circle cx="990" cy="200" r="300" fill="url(#gC)"/>
<circle cx="600" cy="150" r="260" fill="url(#gV)"/>

<!-- osu!mania 4K -->
<text x="110" y="24" class="mono" font-size="12" letter-spacing="2" fill="#FF5FA2">OSU!MANIA · 4K</text>
<g clip-path="url(#field)" mask="url(#topFade)">
  <rect x="110" y="34" width="224" height="300" fill="url(#laneBg)"/>
  <line x1="110" y1="34" x2="110" y2="334" stroke="rgba(255,255,255,0.16)"/><line x1="166" y1="34" x2="166" y2="334" stroke="rgba(255,255,255,0.16)"/><line x1="222" y1="34" x2="222" y2="334" stroke="rgba(255,255,255,0.16)"/><line x1="278" y1="34" x2="278" y2="334" stroke="rgba(255,255,255,0.16)"/><line x1="334" y1="34" x2="334" y2="334" stroke="rgba(255,255,255,0.16)"/>
  <rect class="fl" style="animation-delay:-3.2s" x="110" y="150" width="56" height="140" fill="url(#laneFlash)"/><rect class="fl" style="animation-delay:-2.8s" x="166" y="150" width="56" height="140" fill="url(#laneFlash)"/><rect class="fl" style="animation-delay:-2.4s" x="222" y="150" width="56" height="140" fill="url(#laneFlash)"/><rect class="fl" style="animation-delay:-2.0s" x="278" y="150" width="56" height="140" fill="url(#laneFlash)"/><rect class="fl" style="animation-delay:-1.6s" x="278" y="150" width="56" height="140" fill="url(#laneFlash)"/><rect class="fl" style="animation-delay:-1.2s" x="222" y="150" width="56" height="140" fill="url(#laneFlash)"/><rect class="fl" style="animation-delay:-0.8s" x="166" y="150" width="56" height="140" fill="url(#laneFlash)"/><rect class="fl" style="animation-delay:-0.4s" x="110" y="150" width="56" height="140" fill="url(#laneFlash)"/>
  <rect class="nl" style="animation-delay:-3.2s" x="116" y="-16" width="44" height="16" rx="5" fill="url(#noteL)"/><rect class="nl" style="animation-delay:-2.8s" x="172" y="-16" width="44" height="16" rx="5" fill="url(#noteL)"/><rect class="nl" style="animation-delay:-2.4s" x="228" y="-16" width="44" height="16" rx="5" fill="url(#noteL)"/><rect class="nl" style="animation-delay:-2.0s" x="284" y="-16" width="44" height="16" rx="5" fill="url(#noteL)"/><rect class="nl" style="animation-delay:-1.6s" x="284" y="-16" width="44" height="16" rx="5" fill="url(#noteL)"/><rect class="nl" style="animation-delay:-1.2s" x="228" y="-16" width="44" height="16" rx="5" fill="url(#noteL)"/><rect class="nl" style="animation-delay:-0.8s" x="172" y="-16" width="44" height="16" rx="5" fill="url(#noteL)"/><rect class="nl" style="animation-delay:-0.4s" x="116" y="-16" width="44" height="16" rx="5" fill="url(#noteL)"/>
</g>
<rect x="106" y="288" width="232" height="4" rx="2" fill="#fff" filter="url(#glow)"/>
<rect x="116" y="302" width="44" height="18" rx="5" fill="none" stroke="rgba(255,255,255,0.4)"/><rect x="172" y="302" width="44" height="18" rx="5" fill="none" stroke="rgba(255,255,255,0.4)"/><rect x="228" y="302" width="44" height="18" rx="5" fill="none" stroke="rgba(255,255,255,0.4)"/><rect x="284" y="302" width="44" height="18" rx="5" fill="none" stroke="rgba(255,255,255,0.4)"/>
<rect class="fl" style="animation-delay:-3.2s" x="116" y="302" width="44" height="18" rx="5" fill="#FF5FA2"/><rect class="fl" style="animation-delay:-2.8s" x="172" y="302" width="44" height="18" rx="5" fill="#FF5FA2"/><rect class="fl" style="animation-delay:-2.4s" x="228" y="302" width="44" height="18" rx="5" fill="#FF5FA2"/><rect class="fl" style="animation-delay:-2.0s" x="284" y="302" width="44" height="18" rx="5" fill="#FF5FA2"/><rect class="fl" style="animation-delay:-1.6s" x="284" y="302" width="44" height="18" rx="5" fill="#FF5FA2"/><rect class="fl" style="animation-delay:-1.2s" x="228" y="302" width="44" height="18" rx="5" fill="#FF5FA2"/><rect class="fl" style="animation-delay:-0.8s" x="172" y="302" width="44" height="18" rx="5" fill="#FF5FA2"/><rect class="fl" style="animation-delay:-0.4s" x="116" y="302" width="44" height="18" rx="5" fill="#FF5FA2"/>

<!-- flow arrows -->
<line x1="356" y1="190" x2="420" y2="190" stroke="#FF5FA2" stroke-width="2" class="flow"/>
<line x1="780" y1="190" x2="844" y2="190" stroke="#6FE3FF" stroke-width="2" class="flow"/>

<!-- wordmark -->
<text x="600" y="96" class="mono" font-size="12" letter-spacing="3" fill="rgba(244,242,255,0.55)" text-anchor="middle">OFFLINE · ANDROID · CLI</text>
<text x="600" y="186" font-size="78" font-weight="800" text-anchor="middle" letter-spacing="-1"><tspan fill="url(#osz)">osz</tspan><tspan class="two" fill="#fff" font-weight="300">2</tspan><tspan fill="url(#pez)">pez</tspan></text>
<text x="600" y="228" font-size="19" fill="#F4F2FF" text-anchor="middle" letter-spacing="1">osu!mania 4K  →  Phira RPE</text>
<text x="600" y="262" font-size="15" fill="rgba(244,242,255,0.6)" text-anchor="middle" letter-spacing="2">4 条轨道进去，1 条判定线出来</text>
<g class="st" style="animation-delay:-3.20s"><rect x="419" y="330" width="66" height="22" rx="11"/><text x="452" y="345.5">unzip</text></g><line x1="487" y1="341" x2="491" y2="341" class="sep"/><g class="st" style="animation-delay:-2.56s"><rect x="493" y="330" width="66" height="22" rx="11"/><text x="526" y="345.5">parse</text></g><line x1="561" y1="341" x2="565" y2="341" class="sep"/><g class="st" style="animation-delay:-1.92s"><rect x="567" y="330" width="66" height="22" rx="11"/><text x="600" y="345.5">convert</text></g><line x1="635" y1="341" x2="639" y2="341" class="sep"/><g class="st" style="animation-delay:-1.28s"><rect x="641" y="330" width="66" height="22" rx="11"/><text x="674" y="345.5">verify</text></g><line x1="709" y1="341" x2="713" y2="341" class="sep"/><g class="st" style="animation-delay:-0.64s"><rect x="715" y="330" width="66" height="22" rx="11"/><text x="748" y="345.5">export</text></g>

<!-- Phira judge line -->
<text x="1140" y="24" class="mono" font-size="12" letter-spacing="2" fill="#6FE3FF" text-anchor="end">PHIRA · RPE</text>
<g class="tilt">
  <g clip-path="url(#sky)" mask="url(#topFade)"><rect class="nr" style="animation-delay:-3.2s" x="854.0" y="56.5" width="56" height="7" rx="2" fill="url(#noteR)"/><rect class="nr" style="animation-delay:-2.8s" x="926.0" y="56.5" width="56" height="7" rx="2" fill="url(#noteR)"/><rect class="nr" style="animation-delay:-2.4s" x="998.0" y="56.5" width="56" height="7" rx="2" fill="url(#noteR)"/><rect class="nr" style="animation-delay:-2.0s" x="1070.0" y="56.5" width="56" height="7" rx="2" fill="url(#noteR)"/><rect class="nr" style="animation-delay:-1.6s" x="1070.0" y="56.5" width="56" height="7" rx="2" fill="url(#noteR)"/><rect class="nr" style="animation-delay:-1.2s" x="998.0" y="56.5" width="56" height="7" rx="2" fill="url(#noteR)"/><rect class="nr" style="animation-delay:-0.8s" x="926.0" y="56.5" width="56" height="7" rx="2" fill="url(#noteR)"/><rect class="nr" style="animation-delay:-0.4s" x="854.0" y="56.5" width="56" height="7" rx="2" fill="url(#noteR)"/></g>
  <rect x="850" y="288" width="280" height="4" fill="url(#judge)" filter="url(#glow)"/>
  <rect class="bu" style="animation-delay:-3.2s" x="873.0" y="281" width="18" height="18" fill="none" stroke="#FFD36B" stroke-width="2.5"/><rect class="bu" style="animation-delay:-2.8s" x="945.0" y="281" width="18" height="18" fill="none" stroke="#FFD36B" stroke-width="2.5"/><rect class="bu" style="animation-delay:-2.4s" x="1017.0" y="281" width="18" height="18" fill="none" stroke="#FFD36B" stroke-width="2.5"/><rect class="bu" style="animation-delay:-2.0s" x="1089.0" y="281" width="18" height="18" fill="none" stroke="#FFD36B" stroke-width="2.5"/><rect class="bu" style="animation-delay:-1.6s" x="1089.0" y="281" width="18" height="18" fill="none" stroke="#FFD36B" stroke-width="2.5"/><rect class="bu" style="animation-delay:-1.2s" x="1017.0" y="281" width="18" height="18" fill="none" stroke="#FFD36B" stroke-width="2.5"/><rect class="bu" style="animation-delay:-0.8s" x="945.0" y="281" width="18" height="18" fill="none" stroke="#FFD36B" stroke-width="2.5"/><rect class="bu" style="animation-delay:-0.4s" x="873.0" y="281" width="18" height="18" fill="none" stroke="#FFD36B" stroke-width="2.5"/>
</g>
</svg>
